<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gradle Spring Boot Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f5;
            text-align: center;
            padding-top: 50px;
        }
        .card {
            background: #ffffff;
            display: inline-block;
            padding: 30px 50px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #023047; }
        p { color: #219ebc; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to Spring Boot with Gradle!</h1>
        <p>Application built and executed successfully via Gradle tasks.</p>
    </div>
</body>
</html>
